name: hypernode_stack

services:

  messagebroker:
    image: artecoglobalcompany/usee_message_broker:latest
    networks:
      - hypernode-net
    environment:
      RABBITMQ_DEFAULT_USER: hypernode
      RABBITMQ_DEFAULT_PASS: hypernode
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
    container_name: messagebroker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  gateway:
    image: artecoglobalcompany/usee_suite_manager:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/gateway-db
      - SERVER_TIMEZONE=Europe/Rome
      - SERVER_NAME=synology
      - BACKUPS_PATH=/data/gateway/backups
      - LICENSE_PROVIDER_URL=https://www.arteco-global.com/en/wp-json/sso-provider/login
    container_name: gateway
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - gateway_config:/data/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  camera:
    image: artecoglobalcompany/usee_live_streamer:latest
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
      - GATEWAY_URI=ws://127.0.0.1:8181
      - DATABASE_URI=mongodb://127.0.0.1:27017/camera-db
    container_name: camera
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      messagebroker:
        condition: service_healthy

  metadata:
    image: artecoglobalcompany/usee_metadata_manager:latest
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
      - GATEWAY_URI=ws://127.0.0.1:8181
      - DATABASE_URI=mongodb://127.0.0.1:27017/metadata-db
    container_name: metadata
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      messagebroker:
        condition: service_healthy

  coretrust:
    image: artecoglobalcompany/usee_coretrust:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/coretrust-db
      - CERT_PATH=/ssl
      - SERIAL_NUMBER=V02260031
      - ARTECO_GLOBAL_EMAIL=****
      - ARTECO_GLOBAL_PASSWORD=****
      - SERVER_IP_ADDRESS=192.168.10.39
      - CERTIFICATE_PROVIDER_URL=https://xs9punpjw2.execute-api.eu-central-1.amazonaws.com/Cert/renew_hypernode
      - DNS_PROVIDER_URL=https://zqhck0x3yi.execute-api.eu-central-1.amazonaws.com/dyndns/update_hypernode
      - LICENSE_PROVIDER_URL=https://www.arteco-global.com/en/wp-json/sso-provider/login
      - CORETRUST_CONFIG_PATH=/data/coretrust/config.json
    container_name: coretrust
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - hypernode_security_shared_files:/ssl
      - coretrust_config:/data/coretrust
    extra_hosts:
      - "host.docker.internal:host-gateway"

  recording:
    image: artecoglobalcompany/usee_media_recorder:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/recording-db
      - GATEWAY_URI=ws://webserver
      - RECORDING_PATH=/recording_files
      - RECORDING_DISK_SPACE=100000000
    container_name: recording
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - /volume1/arteco/recordings:/recording_files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  event:
    image: artecoglobalcompany/usee_event_manager:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/event-db
    container_name: event
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy

  auth:
    image: artecoglobalcompany/usee_id_verifier:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/auth-db
    container_name: auth
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy

  snapshot:
    image: artecoglobalcompany/usee_snapshot_recorder:latest
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://192.168.10.89:27017/snapshot-db
      - GATEWAY_URI=ws://webserver
      - SNAPSHOT_PATH=/snapshot_files
      - SNAPSHOT_DISK_SPACE=100000000
    container_name: snapshot
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - /volume1/arteco/snapshots:/snapshot_files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webserver:
    image: artecoglobalcompany/usee_web_server:latest
    container_name: webserver
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    ports:
      - "8181:80"

  configurator:
    image: artecoglobalcompany/usee_configurator:latest
    container_name: configurator
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy

  portbroker:
    image: artecoglobalcompany/usee_port_broker:latest
    container_name: portbroker
    ports:
      - "480:443"
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
      webserver:
        condition: service_healthy
    volumes:
      - hypernode_security_shared_files:/ssl

volumes:
  rabbitmq_data:
    name: rabbitmq_data

  hypernode_security_shared_files:
    name: hypernode_security_shared_files

  gateway_config:
    name: gateway_config

  coretrust_config:
    name: coretrust_config

networks:
  hypernode-net:
    name: hypernode-net
    driver: bridge
