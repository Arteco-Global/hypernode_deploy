name: hypernode_stack

services:
  database:
    image: artecoglobalcompany/usee_database:latest
    container_name: database
    networks:
      - hypernode-net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=hypernode_synology
      - MONGO_INITDB_ROOT_PASSWORD=HypernodeSynology2026!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  messagebroker:
    image: artecoglobalcompany/usee_message_broker:latest
    container_name: messagebroker
    networks:
      - hypernode-net
    environment:
      RABBITMQ_DEFAULT_USER: hypernode
      RABBITMQ_DEFAULT_PASS: hypernode
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  watchdog:
    image: artecoglobalcompany/usee_watchdog:latest
    container_name: watchdog
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/watchdog-db?authSource=admin
      - GATEWAY_URI=ws://webserver
      - MACHINE=synology
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  gateway:
    image: artecoglobalcompany/usee_suite_manager:latest
    container_name: gateway
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/gateway-db?authSource=admin
      - SERVER_TIMEZONE=Europe/Rome
      - SERVER_NAME=synology
      - MACHINE=synology
      - BACKUPS_PATH=/data/gateway/backups
      - LICENSE_PROVIDER_URL=https://www.arteco-global.com/en/wp-json/sso-provider/login
      - HYPERNODE_SERVER_SECRET=synology
    volumes:
      - gateway_config:/data/gateway
    restart: unless-stopped
    depends_on:
      watchdog:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const port=process.env.MS_GATEWAY_SERVICE_PORT || 5001;const req=http.get({host:'127.0.0.1',port,path:'/health/ready'},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});"
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  configurator:
    image: artecoglobalcompany/usee_configurator:latest
    container_name: configurator
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  export:
    image: artecoglobalcompany/arteco-export-service:latest
    container_name: export
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_started
    ports:
      - "5500:5500"
    environment:
      - PORT=5500
      - LOCAL_DB_CONNECTION=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/exports?authSource=admin
      - REACT_APP_EXPORTS_TIMEZONE=Europe/Rome
    volumes:
      - arteco_exports:/home/node/arteco-export-service/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  webserver:
    image: artecoglobalcompany/usee_web_server:latest
    container_name: webserver
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      export:
        condition: service_started
    ports:
      - "8181:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  camera:
    image: artecoglobalcompany/usee_live_streamer:latest
    container_name: camera
    network_mode: "host"
    restart: unless-stopped
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
      - GATEWAY_URI=ws://127.0.0.1:8181
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@127.0.0.1:27017/camera-db?authSource=admin
      - MACHINE=synology
    depends_on:
      webserver:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  metadata:
    image: artecoglobalcompany/usee_metadata_manager:latest
    container_name: metadata
    network_mode: "host"
    restart: unless-stopped
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
      - GATEWAY_URI=ws://127.0.0.1:8181
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@127.0.0.1:27017/metadata-db?authSource=admin
      - MACHINE=synology
    depends_on:
      webserver:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  auth:
    image: artecoglobalcompany/usee_id_verifier:latest
    container_name: auth
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/auth-db?authSource=admin
      - MACHINE=synology
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  recording:
    image: artecoglobalcompany/usee_media_recorder:latest
    container_name: recording
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/recording-db?authSource=admin
      - GATEWAY_URI=ws://webserver
      - RECORDING_PATH=/recording_files
      - RECORDING_DISK_SPACE=3000000000
      - MACHINE=synology
    volumes:
      - /volume1/arteco/recordings:/recording_files
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  event:
    image: artecoglobalcompany/usee_event_manager:latest
    container_name: event
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/event-db?authSource=admin
      - MACHINE=synology
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  snapshot:
    image: artecoglobalcompany/usee_snapshot_recorder:latest
    container_name: snapshot
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/snapshot-db?authSource=admin
      - GATEWAY_URI=ws://webserver
      - SNAPSHOT_PATH=/snapshot_files
      - SNAPSHOT_DISK_SPACE=3000000000
      - MACHINE=synology
    volumes:
      - /volume1/arteco/snapshots:/snapshot_files
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  coretrust:
    image: artecoglobalcompany/usee_coretrust:latest
    container_name: coretrust
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://hypernode_synology:HypernodeSynology2026!@host.docker.internal:27017/coretrust-db?authSource=admin
      - CERT_PATH=/ssl
      - SERIAL_NUMBER=V02260031
      - ARTECO_GLOBAL_EMAIL=
      - ARTECO_GLOBAL_PASSWORD=
      - SERVER_IP_ADDRESS=192.168.10.89
      - CERTIFICATE_PROVIDER_URL=
      - DNS_PROVIDER_URL=
      - LICENSE_PROVIDER_URL=https://www.arteco-global.com/en/wp-json/sso-provider/login
      - MACHINE=synology
      - CORETRUST_CONFIG_PATH=/data/coretrust/config.json
    volumes:
      - hypernode_security_shared_files:/ssl
      - coretrust_config:/data/coretrust
    restart: unless-stopped
    depends_on:
      webserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  portbroker:
    image: artecoglobalcompany/usee_port_broker:latest
    container_name: portbroker
    networks:
      - hypernode-net
    ports:
      - "480:443"
    volumes:
      - hypernode_security_shared_files:/ssl
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
      webserver:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  rabbitmq_data:
  hypernode_security_shared_files:
  gateway_config:
  coretrust_config:
  mongodb_data:
  mongodb_config:
  arteco_exports:

networks:
  hypernode-net:
    driver: bridge
