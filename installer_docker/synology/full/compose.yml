name: hypernode_stack

services:

  database:
    image: artecoglobalcompany/usee_database:pre-release
    container_name: database
    networks:
      - hypernode-net
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped

  messagebroker:
    image: artecoglobalcompany/usee_message_broker:pre-release
    container_name: messagebroker
    networks:
      - hypernode-net
    environment:
      RABBITMQ_DEFAULT_USER: hypernode
      RABBITMQ_DEFAULT_PASS: hypernode
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    image: artecoglobalcompany/usee_suite_manager:pre-release
    container_name: gateway
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/gateway-db
      - SERVER_TIMEZONE=Europe/Rome
      - SERVER_NAME=synology
      - BACKUPS_PATH=/data/gateway/backups
      - LICENSE_PROVIDER_URL=https://www.arteco-global.com/en/wp-json/sso-provider/login
    volumes:
      - gateway_config:/data/gateway
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  camera:
    image: artecoglobalcompany/usee_live_streamer:pre-release
    container_name: camera
    network_mode: host
    restart: unless-stopped
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@192.168.10.89:5672
      - GATEWAY_URI=ws://localhost:8181
      - DATABASE_URI=mongodb://192.168.10.89:27017/camera-db
    depends_on:
      - messagebroker
      - database

  metadata:
    image: artecoglobalcompany/usee_metadata_manager:pre-release
    container_name: metadata
    network_mode: host
    restart: unless-stopped
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@192.168.10.89:5672
      - GATEWAY_URI=ws://localhost:8181
      - DATABASE_URI=mongodb://192.168.10.89:27017/metadata-db
    depends_on:
      - messagebroker
      - database

  coretrust:
    image: artecoglobalcompany/usee_coretrust:pre-release
    container_name: coretrust
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/coretrust-db
      - CERT_PATH=/ssl
      - SERIAL_NUMBER=V02260031
      - SERVER_IP_ADDRESS=192.168.10.89
    volumes:
      - hypernode_security_shared_files:/ssl
      - coretrust_config:/data/coretrust
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  recording:
    image: artecoglobalcompany/usee_media_recorder:pre-release
    container_name: recording
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/recording-db
      - GATEWAY_URI=ws://webserver
      - RECORDING_PATH=/recording_files
      - RECORDING_DISK_SPACE=100000000
    volumes:
      - /volume1/arteco/recordings:/recording_files
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  event:
    image: artecoglobalcompany/usee_event_manager:pre-release
    container_name: event
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/event-db
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  auth:
    image: artecoglobalcompany/usee_id_verifier:pre-release
    container_name: auth
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/auth-db
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  snapshot:
    image: artecoglobalcompany/usee_snapshot_recorder:pre-release
    container_name: snapshot
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://database:27017/snapshot-db
      - GATEWAY_URI=ws://webserver
      - SNAPSHOT_PATH=/snapshot_files
      - SNAPSHOT_DISK_SPACE=100000000
    volumes:
      - /volume1/arteco/snapshots:/snapshot_files
    restart: unless-stopped
    depends_on:
      - messagebroker
      - database

  export:
    image: artecoglobalcompany/arteco-export-service:pre-release
    container_name: export
    networks:
      - hypernode-net
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - PORT=5500
      - LOCAL_DB_CONNECTION=mongodb://192.168.10.89:27017/camera-db/exports
      - REACT_APP_EXPORTS_TIMEZONE=Europe/Rome
    volumes:
      - arteco_exports:/home/node/arteco-export-service/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  webserver:
    image: artecoglobalcompany/usee_web_server:pre-release
    container_name: webserver
    networks:
      - hypernode-net
    ports:
      - "8181:80"
    restart: unless-stopped
    depends_on:
      - messagebroker

  configurator:
    image: artecoglobalcompany/usee_configurator:pre-release
    container_name: configurator
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      - messagebroker

  portbroker:
    image: artecoglobalcompany/usee_port_broker:pre-release
    container_name: portbroker
    networks:
      - hypernode-net
    ports:
      - "480:443"
    volumes:
      - hypernode_security_shared_files:/ssl
    restart: unless-stopped
    depends_on:
      - messagebroker
      - webserver

volumes:
  rabbitmq_data:
  hypernode_security_shared_files:
  gateway_config:
  coretrust_config:
  mongodb_data:
  mongodb_config:

networks:
  hypernode-net:
    driver: bridge