name: integration_${PROCESS_NAME}

services:

  integration:
    image: artecoglobalcompany/usee_integration_manager:${DOCKER_TAG:-latest}
    environment:
      - RABBITMQ_URI=${RMQ}
      - GATEWAY_URI=${GRI}
      - DATABASE_URI=mongodb://${DB_USERNAME:-hypernode}:${DB_PASSWORD:-hypernode}@127.0.0.1:${DB_PORT}/integration_${PROCESS_NAME}?authSource=admin
      - SRV_INST_NAME=integration_${PROCESS_NAME}
      - MACHINE=${MACHINE}
    container_name: integration_${PROCESS_NAME}
    restart: unless-stopped    
    network_mode: "host"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
