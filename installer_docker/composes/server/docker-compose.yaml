services:

  messagebroker:
    image: artecoglobalcompany/usee_message_broker:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      RABBITMQ_DEFAULT_USER: hypernode
      RABBITMQ_DEFAULT_PASS: hypernode
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
    container_name: messagebroker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  gateway:
    image: artecoglobalcompany/usee_suite_manager:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/gateway-db
      - SERVER_TIMEZONE=${SERVER_TIMEZONE:-Europe/Rome}
      - SERVER_NAME=${SERVER_NAME:-Hypernode Server}
      - MACHINE=${MACHINE}
      - BACKUPS_PATH=/data/gateway/backups
      - LICENSE_PROVIDER_URL=${LICENSE_PROVIDER_URL}
    container_name: gateway
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - gateway_config:/data/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  camera:
    image: artecoglobalcompany/usee_live_streamer:${DOCKER_TAG:-latest}
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
      - GATEWAY_URI=ws://127.0.0.1:8181
      - DATABASE_URI=mongodb://127.0.0.1:${DB_PORT:-27017}/camera-db
      - MACHINE=${MACHINE}
    container_name: camera
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      messagebroker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  metadata:
      image: artecoglobalcompany/usee_metadata_manager:${DOCKER_TAG:-latest}
      environment:
        - RABBITMQ_URI=amqp://hypernode:hypernode@127.0.0.1:5672
        - GATEWAY_URI=ws://127.0.0.1:8181
        - DATABASE_URI=mongodb://127.0.0.1:${DB_PORT:-27017}/metadata-db
        - MACHINE=${MACHINE}
      container_name: metadata
      restart: unless-stopped
      network_mode: "host"
      depends_on:
        messagebroker:
          condition: service_healthy
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "5"

  coretrust:
    image: artecoglobalcompany/usee_coretrust:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/coretrust-db
      - CERT_PATH=/ssl
      - SERIAL_NUMBER=${SERIAL_NUMBER}
      - ARTECO_GLOBAL_EMAIL=${ARTECO_GLOBAL_EMAIL}
      - ARTECO_GLOBAL_PASSWORD=${ARTECO_GLOBAL_PASSWORD}
      - SERVER_IP_ADDRESS=${SERVER_IP_ADDRESS}
      - CERTIFICATE_PROVIDER_URL=${CERTIFICATE_PROVIDER_URL}
      - DNS_PROVIDER_URL=${DNS_PROVIDER_URL}
      - LICENSE_PROVIDER_URL=${LICENSE_PROVIDER_URL}
      - MACHINE=${MACHINE}
      - CORETRUST_CONFIG_PATH=/data/coretrust/config.json
    container_name: coretrust
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - hypernode_security_shared_files:/ssl
      - coretrust_config:/data/coretrust
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # storage:
  #   image: artecoglobalcompany/usee_media_storage:${DOCKER_TAG:-latest}
  #   networks:
  #     - hypernode-net
  #   environment:
  #     - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
  #     - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/storage-db
  #     - STORAGE_PATH=/storage_files
  #     - STORAGE_DISK_SPACE=${STORAGE_DISK_SPACE:-10000000}
  #   container_name: storage
  #   restart: unless-stopped
  #   depends_on:
  #     messagebroker:
  #       condition: service_healthy
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - ${STORAGE_PATH}:/storage_files
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

  recording:
    image: artecoglobalcompany/usee_media_recorder:${DOCKER_TAG:-latest}
    networks:
       - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/recording-db
      - GATEWAY_URI=ws://webserver
      - RECORDING_PATH=/recording_files
      - RECORDING_DISK_SPACE=${RECORDING_DISK_SPACE:-10000000}
      - MACHINE=${MACHINE}
    container_name: recording
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - ${RECORDING_PATH}:/recording_files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  event:
    image: artecoglobalcompany/usee_event_manager:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/event-db
      - MACHINE=${MACHINE}
    container_name: event
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  auth:
    image: artecoglobalcompany/usee_id_verifier:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/auth-db
      - MACHINE=${MACHINE}
    container_name: auth
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  snapshot:
    image: artecoglobalcompany/usee_snapshot_recorder:${DOCKER_TAG:-latest}
    networks:
      - hypernode-net
    environment:
      - RABBITMQ_URI=amqp://hypernode:hypernode@messagebroker:5672
      - DATABASE_URI=mongodb://host.docker.internal:${DB_PORT:-27017}/snapshot-db
      - GATEWAY_URI=ws://webserver
      - SNAPSHOT_PATH=/snapshot_files
      - SNAPSHOT_DISK_SPACE=${SNAPSHOT_DISK_SPACE:-10000000}
      - MACHINE=${MACHINE}
    container_name: snapshot
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    volumes:
      - ${SNAPSHOT_PATH}:/snapshot_files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  export:
    image: artecoglobalcompany/arteco-export-service:${DOCKER_TAG:-latest}
    container_name: export
    networks:
      - hypernode-net
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - PORT=5500
      - LOCAL_DB_CONNECTION=mongodb://host.docker.internal:${DB_PORT:-27017}/exports
    volumes:
      - arteco_exports:/home/node/arteco-export-service/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  webserver:
    image: artecoglobalcompany/usee_web_server:${DOCKER_TAG:-latest}
    container_name: webserver
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
      gateway:
        condition: service_started
      configurator:
        condition: service_started
      export:
        condition: service_started
    ports:
      - "8181:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  configurator:
    image: artecoglobalcompany/usee_configurator:${DOCKER_TAG:-latest}
    container_name: configurator
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  portbroker:
    image: artecoglobalcompany/usee_port_broker:${DOCKER_TAG:-latest}
    container_name: portbroker
    ports:
      - "${SSL_PORT:-443}:443"
    networks:
      - hypernode-net
    restart: unless-stopped
    depends_on:
      messagebroker:
        condition: service_healthy
      webserver:
        condition: service_healthy
    volumes:
      - hypernode_security_shared_files:/ssl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  rabbitmq_data:
  hypernode_security_shared_files:
  gateway_config:
  coretrust_config:
  arteco_exports:

networks:
  hypernode-net:
    driver: bridge
