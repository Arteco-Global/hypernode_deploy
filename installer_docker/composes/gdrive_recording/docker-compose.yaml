version: "3.9"

name: gdrive_recording_${PROCESS_NAME}

services:
  snapshot:
    image: gdrive_recording:latest       # <-- la tua immagine locale
    container_name: gdrive_recording_${PROCESS_NAME}
    privileged: true                    # necessario per FUSE
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    tmpfs:
      - /dev/shm:size=1g
    environment:
      - RCLONE_CONFIG_BASE64=${RCLONE_CONFIG_BASE64}
      - GDRIVE_REMOTE=gdrive
      - GDRIVE_PATH=HYPERNODE
      - MOUNT_PATH=/recording_files
      - RCLONE_CACHE_DIR=/dev/shm/rclone-cache
      - RABBITMQ_URI=${RMQ}
      - DATABASE_URI=mongodb://127.0.0.1:${DB_PORT}/gdrive_recording_${PROCESS_NAME}
      - GATEWAY_URI=${GRI}
      - SRV_INST_NAME=gdrive_recording_${PROCESS_NAME}
      - RECORDING_DISK_SPACE=${RECORDING_DISK_SPACE:-10000000}
      - RECORDING_PATH=/recording_files
    network_mode: "host"
    restart: unless-stopped
