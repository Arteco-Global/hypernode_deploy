name: local_database_for_USS_SERVER

services:
  
  database:
    image: artecoglobalcompany/usee_database:${DOCKER_TAG:-latest}
    ports:
      - "127.0.0.1:${DB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db          # <- path giusto
      - mongodb_config:/data/configdb  # <- opzionale ma pulito
    container_name: USS_SERVER #in caso di installazione completa DB_NAME viene hardcodato in USS_SERVER dall'installer
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        
volumes:
  mongodb_data:
    name: database_for_USS_SERVER
  mongodb_config:
    name: config_for_USS_SERVER
