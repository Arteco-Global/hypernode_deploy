name: local_database_for_${DB_NAME:-USS_SERVER}

services:
  
  database:
    image: artecoglobalcompany/usee_database:${DOCKER_TAG:-latest}
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db          # <- path giusto
      - mongodb_config:/data/configdb  # <- opzionale ma pulito
    container_name: ${DB_NAME:-USS_SERVER} #in caso di installazione completa DB_NAME viene hardcodato in USS_SERVER dall'installer
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        
volumes:
  mongodb_data:
    external: true
    name: database_for_${DB_NAME:-USS_SERVER}

  mongodb_config:
    external: true
    name: config_for_${DB_NAME:-USS_SERVER}