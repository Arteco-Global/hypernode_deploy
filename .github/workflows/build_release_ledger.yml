name: Build Release Ledger

on:
  workflow_dispatch:
    inputs:
      RUN_ID_OR_URL:
        description: "GitHub Actions run id o URL completa della run da analizzare"
        required: true
      TAG_FILTER:
        description: "Logga solo run con questo tag"
        required: true
        default: "latest"
      RESOLUTION_MODE:
        description: "strict fallisce se non riesce a ricostruire la run"
        required: true
        type: choice
        options:
          - strict
          - best-effort
        default: strict
  workflow_call:
    inputs:
      RUN_ID_OR_URL:
        required: true
        type: string
      TAG_FILTER:
        required: false
        type: string
        default: "latest"
      RESOLUTION_MODE:
        required: false
        type: string
        default: "strict"
      DIRECT_TAG:
        required: false
        type: string
      DIRECT_SERVICES:
        required: false
        type: string
      DIRECT_BACKEND_BRANCH:
        required: false
        type: string
      DIRECT_BACKEND_SHA:
        required: false
        type: string
      DIRECT_CONFIGURATOR_BRANCH:
        required: false
        type: string
      DIRECT_CONFIGURATOR_SHA:
        required: false
        type: string
      DIRECT_EXPORT_BRANCH:
        required: false
        type: string
      DIRECT_EXPORT_SHA:
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: release-ledger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build_release_ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate ledger entry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
          TARGET_REPOSITORY: ${{ github.repository }}
          RUN_ID_OR_URL: ${{ inputs.RUN_ID_OR_URL }}
          TAG_FILTER: ${{ inputs.TAG_FILTER }}
          RESOLUTION_MODE: ${{ inputs.RESOLUTION_MODE }}
          DIRECT_TAG: ${{ inputs.DIRECT_TAG }}
          DIRECT_SERVICES: ${{ inputs.DIRECT_SERVICES }}
          DIRECT_BACKEND_BRANCH: ${{ inputs.DIRECT_BACKEND_BRANCH }}
          DIRECT_BACKEND_SHA: ${{ inputs.DIRECT_BACKEND_SHA }}
          DIRECT_CONFIGURATOR_BRANCH: ${{ inputs.DIRECT_CONFIGURATOR_BRANCH }}
          DIRECT_CONFIGURATOR_SHA: ${{ inputs.DIRECT_CONFIGURATOR_SHA }}
          DIRECT_EXPORT_BRANCH: ${{ inputs.DIRECT_EXPORT_BRANCH }}
          DIRECT_EXPORT_SHA: ${{ inputs.DIRECT_EXPORT_SHA }}
        run: |
          set -euo pipefail
          python3 scripts/release_ledger/build_release_ledger.py

      - name: Upload generated ledger artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger
          path: |
            release_ledger.json
            release_ledger.md
          if-no-files-found: error

      - name: Commit and push ledger updates
        shell: bash
        env:
          RUN_ID_OR_URL: ${{ inputs.RUN_ID_OR_URL }}
        run: |
          set -euo pipefail

          if git diff --quiet -- release_ledger.json release_ledger.md; then
            echo "No ledger changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release_ledger.json release_ledger.md
          git commit -m "chore: update release ledger for run ${RUN_ID_OR_URL}"
          git push origin HEAD:${GITHUB_REF_NAME}
