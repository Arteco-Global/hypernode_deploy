name: Bump patch version on Configurator

on:
  workflow_dispatch:
    inputs:
      BRANCH_CONFIGURATOR_REF:
        description: 'Checkout branch Configurator (default: release_candidate)'
        required: true
        default: 'release_candidate'

jobs:
  bump_version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v3
        with:
          repository: Arteco-Global/hypernode_server_gui
          ref: ${{ github.event.inputs.BRANCH_CONFIGURATOR_REF }}
          path: hypernode_server_gui
          token: ${{ secrets.GIT_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: hypernode_server_gui
        run: npm ci

      - name: Bump patch version
        working-directory: hypernode_server_gui
        run: npm version patch --no-git-tag-version

      - name: Commit and push changes
        working-directory: hypernode_server_gui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump patch version"
          git push origin ${{ github.event.inputs.BRANCH_CONFIGURATOR_REF }}
