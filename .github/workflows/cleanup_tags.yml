name: Cleanup Docker Hub Tags

on:
  # schedule:
  #   - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Se true, non cancella nulla e stampa solo cosa verrebbe eliminato'
        required: true
        type: boolean
        default: true
      repositories:
        description: 'Lista repository Docker Hub separati da virgola'
        required: false
        default: 'usee_live_streamer,usee_id_verifier,usee_event_manager,usee_metadata_manager,usee_suite_manager,usee_media_recorder,usee_snapshot_recorder,usee_web_server,usee_port_broker,usee_message_broker,usee_database,usee_coretrust,usee_configurator,arteco-export-service'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Cleanup old tags
        uses: lostlink/docker-cleanup@v1.0.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}
          organization: artecoglobalcompany
          repositories: ${{ github.event.inputs.repositories || 'usee_live_streamer,usee_id_verifier,usee_event_manager,usee_metadata_manager,usee_suite_manager,usee_media_recorder,usee_snapshot_recorder,usee_web_server,usee_port_broker,usee_message_broker,usee_database,usee_coretrust,usee_configurator,arteco-export-service' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          verbose: true
          protected-tags: 'latest,staging,production,pre-release'
          custom-patterns: '{"^.*$": 30}'
