name: Push USee Database On Demand

on:
  workflow_dispatch:
    inputs:
      BRANCH_BACKEND_REF:
        description: 'Checkout branch Backend (server)'
        required: true
        default: 'release_candidate'
      BUILD_TAGS:
        description: 'Quali tag vuoi buildare?'
        required: true
        type: choice
        options:
          - latest+avx_support
          - latest
          - avx_support
        default: 'latest+avx_support'
      CUSTOM_TAG:
        description: "Tag custom opzionale (se valorizzato sostituisce il tag 'latest')"
        required: false
        default: ''
      PLATFORMS:
        description: 'Architettura target Docker (piattaforma di build)'
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
          - linux/arm/v7
          - linux/arm/v6
        default: 'linux/amd64,linux/arm64'

jobs:
  build_and_push_database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLATFORMS: ${{ github.event.inputs.PLATFORMS }}

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v3
        with:
          path: deploy

      - name: Checkout backend
        uses: actions/checkout@v3
        with:
          repository: Arteco-Global/hypernode-server
          ref: ${{ github.event.inputs.BRANCH_BACKEND_REF }}
          path: hypernode-server
          token: ${{ secrets.GIT_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: DockerHub Login
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: DockerHub check
        run: docker info

      - name: BuildDatabaseLatestOrCustom
        if: ${{ inputs.BUILD_TAGS == 'latest+avx_support' || inputs.BUILD_TAGS == 'latest' || inputs.CUSTOM_TAG != '' }}
        run: |
          TAG_ARGS=""
          if [ -n "${{ inputs.CUSTOM_TAG }}" ]; then
            TAG_ARGS="$TAG_ARGS -t artecoglobalcompany/usee_database:${{ inputs.CUSTOM_TAG }}"
          elif [ "${{ inputs.BUILD_TAGS }}" = "latest+avx_support" ] || [ "${{ inputs.BUILD_TAGS }}" = "latest" ]; then
            TAG_ARGS="$TAG_ARGS -t artecoglobalcompany/usee_database:latest"
          fi

          docker buildx build \
            --platform=${{ env.PLATFORMS }} \
            --build-arg MONGO_VERSION=latest \
            --cache-from=type=registry,ref=artecoglobalcompany/usee_database:buildcache \
            --cache-to=type=registry,ref=artecoglobalcompany/usee_database:buildcache,mode=max \
            -f hypernode-server/docker/database/database.Dockerfile \
            $TAG_ARGS \
            --push hypernode-server

      - name: BuildDatabaseAvxSupport
        if: ${{ inputs.BUILD_TAGS == 'latest+avx_support' || inputs.BUILD_TAGS == 'avx_support' }}
        run: |
          docker buildx build \
            --platform=${{ env.PLATFORMS }} \
            --build-arg MONGO_VERSION=4.4.18 \
            --cache-from=type=registry,ref=artecoglobalcompany/usee_database:buildcache \
            --cache-to=type=registry,ref=artecoglobalcompany/usee_database:buildcache,mode=max \
            -f hypernode-server/docker/database/database.Dockerfile \
            -t artecoglobalcompany/usee_database:avx_support \
            --push hypernode-server
