# ===========================================================
# PRODUCTION CONFIGURATION
# Copyright 2025 Arteco
# This configuration file is used for production. 
# It sets up an Nginx server with multiple
# proxy pass locations to route requests to different services
# running on the host machine. The configuration includes SSL
# settings, logging formats, and various location blocks to
# handle websocket connections, API requests, and static content.
# ===========================================================

user root;
worker_processes 4;

events {
    worker_connections 30000;
}

http {

    include mime.types;
    default_type application/octet-stream;

    # Assicurati di avere il tipo configurato
    types {
    application/vnd.apple.mpegurl m3u8;
    }


    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    error_log nginx_error.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile on;
    gzip on;

    server {
        # Server default listening port on 80 and port 443 for SSL
        listen 8080;
        
        charset off;
  
        # This is the websocket location for uSee clients
        location /~ws~ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # There are the websockets location for the live stream
        location /live2/ {
			proxy_pass http://127.0.0.1:8002; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		}

        location /live3/ {
			proxy_pass http://127.0.0.1:8003; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live4/ {
			proxy_pass http://127.0.0.1:8004; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live5/ {
			proxy_pass http://127.0.0.1:8005; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live6/ {
			proxy_pass http://127.0.0.1:8006; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live7/ {
			proxy_pass http://127.0.0.1:8007; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live8/ {
			proxy_pass http://127.0.0.1:8008; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live9/ {
			proxy_pass http://127.0.0.1:8009; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live10/ {
			proxy_pass http://127.0.0.1:8010; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        location /live11/ {
			proxy_pass http://127.0.0.1:8011; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        # This is the websocket location for video streaming
        location /stream/ {
			proxy_pass http://127.0.0.1:8001; 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
		} 

        # This is the old api root for uSee and integrations
        location /api/v1/ {
            proxy_pass http://127.0.0.1:5001/server/capabilities;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # This is the api root for uSee and integrations
        location /api/v2/ {
            proxy_pass http://127.0.0.1:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #Server
        location ~ ^/api/v2/(login|capabilities|services-capabilities)$ {
            proxy_pass http://127.0.0.1:5001/server/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #Events
        location ~ ^/api/v2/(events|sessions-events|event)$ {
            proxy_pass http://127.0.0.1:5001/events/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Maps
        location ~ ^/api/v2/(static-maps)$ {
            proxy_pass http://127.0.0.1:5001/maps/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        #Snapshots
        location ~ ^/api/v2/(get-image|get-snapshot-records|get-snapshot-latest-records|get-event-image)(/.*)?$ {
            if ($request_method = OPTIONS ) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Access-Control-Max-Age 86400; # 24 ore
                return 204;
            }
            proxy_pass http://127.0.0.1:5001/thumbnails/$1$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Recordings
        location ~ ^/api/v2/(get-recording|get-recording-records|get-recording-playlist\.m3u8|play-rec|get-recording-latest-records)(/.*)?$ {
            if ($request_method = OPTIONS ) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Access-Control-Max-Age 86400; # 24 ore
                return 204;
            }
            proxy_pass http://127.0.0.1:5001/recordings/$1$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /tools/nginx/html;
            try_files $uri /index.html;
        }
 

    }
}

