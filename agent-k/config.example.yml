# Interval, in seconds, between one monitoring cycle and the next.
poll_interval_seconds: 15

storage:
  # Path to the SQLite database used to store historical samples and restart events.
  # If the path is relative, it is resolved from the config file directory.
  path: ./data/agent-k.sqlite3
  # Number of days to retain historical samples before automatic cleanup.
  sample_retention_days: 30
  # Number of days to retain restart events before automatic cleanup.
  restart_retention_days: 180

discovery:
  # List of Docker image prefixes to monitor.
  # Any container whose image starts with one of these values will be included.
  image_prefixes:
    # Example: monitor all images published under the artecoglobalcompany Docker Hub namespace.
    - artecoglobalcompany/
  # If false, monitor only containers that are currently running.
  # If true, also include stopped or exited containers during discovery.
  include_non_running: false

memory:
  # Global container RAM usage threshold, as a percentage, above which the service
  # is considered unhealthy and becomes a restart candidate.
  max_percent: 85
  # Number of consecutive cycles the RAM usage must stay above the threshold
  # before a restart is requested.
  breach_cycles: 1

restart:
  # Minimum time, in seconds, to wait between two restarts of the same container.
  cooldown_seconds: 300
  # Maximum number of restarts allowed for the same container within the time window below.
  max_restarts: 3
  # Duration, in seconds, of the time window used to limit the maximum number of restarts.
  window_seconds: 3600
  # Number of consecutive cycles in which Docker metrics collection may fail
  # for a single container before an automatic restart is attempted.
  metrics_failure_cycles: 3

global_memory_intervention:
  # If true, enables a global intervention mode when host RAM stays too high for too long.
  enabled: false
  # Host RAM percentage threshold above which the timer for intervention mode starts.
  enter_percent: 90
  # Number of consecutive seconds above enter_percent required before entering intervention mode.
  enter_duration_seconds: 60
  # Number of initial minutes used to learn what the "normal" host RAM usage is for this installation.
  baseline_learning_minutes: 15
  # Safety margin added to the learned baseline to determine the exit threshold for intervention mode.
  recovery_margin_percent: 8
  # Absolute minimum threshold below which host RAM is considered healthy again after a leak.
  min_exit_percent: 60
  # Absolute maximum exit threshold, useful to avoid making recovery too permissive because of the learned baseline.
  max_exit_percent: 80
  # Waiting time, in seconds, between one global restart and the evaluation of the next service.
  step_duration_seconds: 60
  # Minimum delta between a service's current memory usage and its historical average memory usage
  # for it to be considered anomalous during intervention mode.
  allowed_delta_percent: 15
  # Historical window, in hours, used to calculate the service's average memory usage.
  historical_window_hours: 24

service_overrides:
  # Override key: "recording" matches both the "recording" container
  # and any additional containers such as "recording_additional-*".
  recording:
    memory:
      # Service-specific RAM threshold used instead of the global default.
      max_percent: 50
      # Number of consecutive cycles above threshold required for this specific service.
      breach_cycles: 1
    restart:
      # Service-specific cooldown used instead of the global default.
      cooldown_seconds: 300
      # Maximum number of restarts allowed for this service within the time window below.
      max_restarts: 3
      # Time window, in seconds, used to limit restarts for this service.
      window_seconds: 3600
      # Number of consecutive metrics collection failures that triggers a restart for this service.
      metrics_failure_cycles: 3
