# Intervallo, in secondi, tra un ciclo di monitoraggio e il successivo.
poll_interval_seconds: 15

storage:
  # Percorso del database SQLite usato per salvare sample storici e restart event.
  # Se il percorso e' relativo, viene risolto rispetto alla cartella del file di config.
  path: ./data/agent-k.sqlite3
  # Numero di giorni per cui mantenere i sample storici prima di eliminarli automaticamente.
  sample_retention_days: 30
  # Numero di giorni per cui mantenere gli eventi di restart prima di eliminarli automaticamente.
  restart_retention_days: 180

discovery:
  # Lista di prefissi immagine Docker da monitorare.
  # Tutti i container la cui immagine inizia con uno di questi valori verranno inclusi.
  image_prefixes:
    # Esempio: monitora tutte le immagini pubblicate sotto il namespace Docker Hub artecoglobalcompany.
    - artecoglobalcompany/
  # Se false, monitora solo i container attualmente in esecuzione.
  # Se true, include anche container fermi o terminati nella fase di discovery.
  include_non_running: false

memory:
  # Soglia percentuale globale di utilizzo RAM del container oltre la quale il servizio
  # viene considerato in anomalia e candidato al restart.
  max_percent: 10
  # Numero di cicli consecutivi in cui la RAM deve restare sopra soglia
  # prima che scatti la richiesta di restart.
  breach_cycles: 1

restart:
  # Tempo minimo, in secondi, da attendere tra due restart dello stesso container.
  cooldown_seconds: 300
  # Numero massimo di restart consentiti per lo stesso container nella finestra temporale sotto.
  max_restarts: 3
  # Durata, in secondi, della finestra usata per limitare il numero massimo di restart.
  window_seconds: 3600
  # Numero di cicli consecutivi in cui il recupero delle metriche Docker puo' fallire
  # per un singolo container prima di tentare automaticamente il restart.
  metrics_failure_cycles: 3

service_overrides:
  # Chiave override: "recording" matcha sia il container "recording"
  # sia eventuali container aggiuntivi come "recording_additional-*".
  recording:
    memory:
      # Soglia RAM specifica per questo servizio, usata al posto del default globale.
      max_percent: 65
      # Numero di cicli consecutivi sopra soglia richiesti per questo servizio specifico.
      breach_cycles: 1
    restart:
      # Cooldown specifico per questo servizio, usato al posto del default globale.
      cooldown_seconds: 300
      # Numero massimo di restart consentiti per questo servizio nella finestra temporale sotto.
      max_restarts: 3
      # Finestra temporale, in secondi, usata per limitare i restart di questo servizio.
      window_seconds: 3600
      # Numero di failure metriche consecutive che fa scattare il restart per questo servizio.
      metrics_failure_cycles: 3
  snapshot:
    memory:
      # Soglia RAM specifica per questo servizio, usata al posto del default globale.
      max_percent: 30
      # Numero di cicli consecutivi sopra soglia richiesti per questo servizio specifico.
      breach_cycles: 1
    restart:
      # Cooldown specifico per questo servizio, usato al posto del default globale.
      cooldown_seconds: 300
      # Numero massimo di restart consentiti per questo servizio nella finestra temporale sotto.
      max_restarts: 3
      # Finestra temporale, in secondi, usata per limitare i restart di questo servizio.
      window_seconds: 3600
      # Numero di failure metriche consecutive che fa scattare il restart per questo servizio.
      metrics_failure_cycles: 3
