services:
  agent-k:
    image: ${AGENT_K_IMAGE:-artecoglobalcompany/agent-k:latest}
    container_name: agent-k
    restart: unless-stopped
    volumes:
      - ${AGENT_K_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${AGENT_K_CONFIG_PATH:-./config.yml}:/app/config.yml:ro
      - ${AGENT_K_DATA_PATH:-./data}:/app/data
    command: ["--config", "/app/config.yml"]
